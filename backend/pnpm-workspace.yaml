# pnpm 11-д энэ файл нь тохиргооны файл (.npmrc-ийн залгамжлагч).
# backend нь зөвхөн host-owned package-уудыг workspace-дээ эзэмшинэ.
packages:
  - "packages/contracts"
  - "packages/mn-integrations"

allowBuilds:
  "@prisma/engines": true
  prisma: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@duke333/builder-backend@0.1.0 || 0.1.3 || 0.2.0 || 0.2.1 || 0.2.2 || 0.2.4'
  - '@duke333/builder-contracts@0.1.0 || 0.1.3 || 0.2.0 || 0.2.1 || 0.2.2'
