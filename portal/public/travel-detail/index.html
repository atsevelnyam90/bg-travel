<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src * data: blob:; media-src * data: blob:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/wp-content/themes/blacktomato/dist/css/base.css" />
    <link rel="stylesheet" href="/wp-content/themes/blacktomato/dist/css/current.css" />
    <title></title>
  </head>
  <body
    class="wp-singular post-template-template-experience-superitinerary single single--experience experience new_2023 loaded"
  >
    <main class="main" role="main">
      <section
        class="section section--hero-banner section--hero-banner--single_image section--hero-banner--full section--hero-banner--image section--hero-banner--fixed"
      >
        <div class="banner__image hidden-lg"></div>
        <div class="banner__image visible-lg"></div>
        <div class="container container--absolute">
          <div class="h7 strong align-text-center text--white mb-sm"></div>
          <h1 class="align-text-center text--white"></h1>
          <div class="h7 align-text-center text--white"></div>
        </div>
      </section>

      <section class="section section--subnav">
        <nav class="section__nav section__nav--scroll" aria-label="Аяллын хэсгүүд">
          <div class="container">
            <div class="row row--flex v-align-center">
              <div
                class="col col--lg-8 col--lg-offset-2 col--md-12 col--sm-12 col--xs-12 d-flex v-align-center p-relative"
              >
                <div class="scroller"><ul class="list text-sm-xs letter-spaced-md"></ul></div>
                <div class="nav__fade" style="display: none"></div>
              </div>
            </div>
          </div>
        </nav>
      </section>

      <section class="section section--breadcrumb">
        <div class="breadcrumb">
          <div class="container"><ul class="nav nav--breadcrumbs"></ul></div>
        </div>
      </section>

      <a class="anchor-offset" id="overview"></a>
      <section
        class="section section--content text-base background-custom pt-md-sm pb-xl section--content--bg-no-repeat"
      >
        <div class="container">
          <div class="row">
            <div
              class="col col--lg-8 col--md-8 col--sm-12 col--xs-12 col--lg-offset-2 col--md-offset-2"
            >
              <div class="align-text-center w-100 content__read-more">
                <h6 class="text-bright uppercase small strong mb-none country-links"></h6>
                <h3 class="text-headings text-md"></h3>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="section section--divider mb-md">
        <div class="container"><div class="divider"></div></div>
      </section>

      <section class="section section--experience-facts">
        <div class="container">
          <div class="row">
            <div
              class="col col--lg-8 col--md-8 col--sm-12 col--xs-12 col--lg-offset-2 col--md-offset-2"
            >
              <div class="experience__facts mb-xl">
                <div class="row row--flex justify-content-center">
                  <div class="col col--lg-4 col--md-4 col--sm-4 col--xs-12">
                    <h3 class="text-danger font-heading mb-xs align-text-center"></h3>
                    <div class="text-base italic align-text-center"></div>
                  </div>
                  <div class="col col--lg-4 col--md-4 col--sm-4 col--xs-12">
                    <h3 class="text-success font-heading mb-xs align-text-center"></h3>
                    <div class="text-base italic align-text-center"></div>
                  </div>
                  <div class="col col--lg-4 col--md-4 col--sm-4 col--xs-12">
                    <h3 class="text-info font-heading mb-xs align-text-center"></h3>
                    <div class="text-base italic align-text-center"></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <a class="anchor-offset"></a>
      <section class="section section--destination bg-light">
        <div class="section--destination__map" data-highlight="blue"></div>
        <div class="container py-lg container--blue">
          <div class="row relative z-2">
            <div class="col col--2lg-8 col--lg-12 col--md-12 col--sm-12 col--xs-12">
              <div class="section section--destination__wrapper">
                <div>
                  <div class="section--destination__heading">
                    <div class="text-blue strong uppercase text-brand text-md visible-xs visible-sm"></div>
                    <h2></h2>
                    <div class="mb-lg max-width-lg mx-none"></div>
                    <div
                      class="text-blue strong uppercase text-brand text-md mb-md hidden-xs hidden-sm"
                    ></div>
                  </div>
                  <div
                    class="flex experience-slide flex-col lg:flex-row experience-slide--reverse experience-slide--blue"
                  >
                    <div
                      class="experience-slide__media relative shrink-0 overflow-hidden arrow-slider"
                    ></div>
                    <div class="experience-slide__content bg-white overflow-hidden">
                      <div class="uppercase text-xs strong text-blue mb-xs"></div>
                      <div class="text-base text-md uppercase strong text-headings mb-sm"></div>
                      <div class="text-grey text-md tracking-tight"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section
        class="section section--destination-carousel arrow-slider bg-base-dk"
        data-header-background="light"
        data-header-colour="dark"
      >
        <div class="container">
          <div data-slickslider="destination"></div>
          <div class="arrow-hover">
            <div class="arrow-hover__left"></div>
            <div class="arrow-hover__right"></div>
          </div>
          <div class="slider__meta mx-xs mt-sm">
            <button class="slick__prev slick-arrow" type="button" aria-label="Өмнөх зураг"></button>
            <div class="slider__count"></div>
            <button class="slick__next slick-arrow" type="button" aria-label="Дараагийн зураг"></button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
