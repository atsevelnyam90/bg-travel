server {
    listen 80;
    server_name www.bgtravel.mn bgtravel.mn;

    location ^~ /.well-known/pki-validation/ {
        alias /var/www/pki-validation/;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503 "BG Travel is being prepared for HTTPS.\n";
    }
}
