server {
    listen 80;
    server_name www.bgtravel.mn bgtravel.mn;

    location ^~ /.well-known/pki-validation/ {
        alias /var/www/pki-validation/;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.bgtravel.mn$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.bgtravel.mn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/pki-validation/ {
        alias /var/www/pki-validation/;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }

    # Path-style S3 URL keeps the bucket path intact for AWS SigV4 signatures.
    location ^~ /bgtravel-media/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        client_max_body_size 11m;
    }

    location / {
        proxy_pass http://portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}

server {
    listen 443 ssl;
    server_name bgtravel.mn;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    return 301 https://www.bgtravel.mn$request_uri;
}
