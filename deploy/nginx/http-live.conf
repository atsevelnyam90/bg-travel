server {
    listen 80;
    server_name bgtravel.mn;

    location ^~ /.well-known/pki-validation/ {
        alias /var/www/pki-validation/;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 http://www.bgtravel.mn$request_uri;
    }
}

server {
    listen 80;
    server_name www.bgtravel.mn;

    location ^~ /.well-known/pki-validation/ {
        alias /var/www/pki-validation/;
        default_type text/plain;
        try_files $uri =404;
    }

    location ^~ /api/v1/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
        client_max_body_size 6m;
    }

    # Preserve the bucket path used in S3 request signatures.
    location ^~ /bgtravel-media/ {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_request_buffering off;
        client_max_body_size 11m;
    }

    location / {
        proxy_pass http://portal:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 60s;
    }
}
